<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CrewFlow — إدارة العمليات</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--border:#e3e7ef;--text:#1a2233;--muted:#6b7690;--primary:#2563eb;--primary-dark:#1d4ed8;--success:#16a34a;--warning:#d97706;--danger:#dc2626;--info:#0891b2;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-size:18px;font-weight:700;color:var(--primary)}
.manager-box{display:flex;align-items:center;gap:8px;font-size:13px}
.manager-box select{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;background:#fff}
.tabs{background:var(--card);border-bottom:1px solid var(--border);padding:0 12px;display:flex;gap:4px;overflow-x:auto;position:sticky;top:0;z-index:10}
.tabs button{background:transparent;border:none;padding:14px 14px;cursor:pointer;font-size:14px;color:var(--muted);font-family:inherit;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
main{max-width:1000px;margin:0 auto;padding:20px}
h1{font-size:22px;margin-bottom:4px}
h2{font-size:17px;margin:20px 0 10px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group.full{grid-column:1/-1}
label{font-size:12px;font-weight:600;color:var(--muted)}
input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--text)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
textarea{resize:vertical;min-height:70px}
input[type=checkbox]{width:auto}
.btn{padding:9px 16px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-secondary{background:#eef2fb;color:var(--primary)}
.btn-secondary:hover{background:#dde7fa}
.btn-danger{background:#fee2e2;color:var(--danger)}
.btn-danger:hover{background:#fecaca}
.btn-success{background:#dcfce7;color:var(--success)}
.btn-warning{background:#fef3c7;color:var(--warning)}
.btn-sm{padding:5px 10px;font-size:12px}
.form-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state .icon{font-size:40px;margin-bottom:10px}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.item-card.done_ok{border-color:var(--success);background:#f0fdf4}
.item-card.done_issues{border-color:var(--warning);background:#fffbeb}
.item-card.cancelled{opacity:.6}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.item-head h3{font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:10px;color:var(--muted);font-size:12px;margin-bottom:10px}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.badge.employee{background:#dbeafe;color:#1e40af}
.badge.freelancer{background:#fef3c7;color:#92400e}
.badge.driver{background:#e0e7ff;color:#3730a3}
.badge.open{background:#dbeafe;color:#1e40af}
.badge.assigned{background:#d1fae5;color:#065f46}
.badge.in_progress{background:#fef3c7;color:#92400e}
.badge.done_ok{background:#dcfce7;color:#166534}
.badge.done_issues{background:#fed7aa;color:#9a3412}
.badge.cancelled{background:#f3f4f6;color:#6b7280}
.badge.internal{background:#e0e7ff;color:#3730a3}
.badge.rented{background:#fce7f3;color:#9d174d}
.role-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#f8fafc;border-radius:6px;font-size:13px;margin-bottom:4px}
.role-row.complete{background:#f0fdf4;color:var(--success);font-weight:600}
.role-row .warn{color:var(--warning);font-size:11px}
.assigned-list{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.assigned-person{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#f8fafc;border-radius:6px;font-size:13px}
.assigned-person .conflict{color:var(--danger);font-size:11px;margin-right:6px}
.person-card{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;gap:10px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a2233;color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;transition:transform .3s;z-index:100;max-width:90vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.sub-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.sub-tabs button{background:#eef2fb;border:none;padding:6px 14px;border-radius:999px;font-size:13px;cursor:pointer;color:var(--muted);font-family:inherit}
.sub-tabs button.active{background:var(--primary);color:#fff}
.warn-box{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
.info-box{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
@media(max-width:600px){main{padding:14px}.card{padding:14px}}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">📋 CrewFlow</div>
  <div class="manager-box">
    <label>المدير المسؤول:</label>
    <select id="manager-select"></select>
  </div>
</header>

<nav class="tabs" id="main-tabs">
  <button data-tab="orders">الأوردرات</button>
  <button data-tab="new-order">+ أوردر جديد</button>
  <button data-tab="team">الفريق</button>
  <button data-tab="clients">العملاء</button>
  <button data-tab="equipment">المعدات</button>
  <button data-tab="vacations">الإجازات</button>
</nav>

<main id="main"></main>
<div id="toast" class="toast"></div>

<script>
(function(){
'use strict';

/* ============================================================
   Constants
   ============================================================ */
var KEYS={people:'cf_people',clients:'cf_clients',equipment:'cf_equipment',unavailability:'cf_unavailability',orders:'cf_orders',managers:'cf_managers',currentManager:'cf_current_manager'};
var ROLE_PRESET=['مصور','صوت','فني','فني سويتشر','مراسل','سائق','منتج','مخرج','مهندس بث'];
var EQUIP_CATEGORIES=['كاميرا','صوت','إضاءة','سويتشر','بث','ملحقات','سيارة'];
var DEFAULT_MANAGERS=['مدير التوزيع 1','مدير التوزيع 2','مدير التوزيع 3'];
var STATUS_LABELS={open:'مفتوح',assigned:'مكتمل التعيين',in_progress:'جاري',done_ok:'خلص تمام',done_issues:'خلص بمشاكل',cancelled:'ملغي'};

/* ============================================================
   State
   ============================================================ */
var state={
  currentTab:'orders',
  managers:DEFAULT_MANAGERS.slice(),
  currentManager:'مدير التوزيع 1',
  people:[],clients:[],equipment:[],unavailability:[],orders:[],
  tempRoles:[{role:'مصور',count:1}],
  tempEquipment:[],
  assigningOrderId:null,
  teamFilter:'all'
};

/* ============================================================
   Storage
   ============================================================ */
function loadAll(){
  state.managers=getLS(KEYS.managers)||DEFAULT_MANAGERS.slice();
  state.currentManager=getLS(KEYS.currentManager)||state.managers[0];
  state.people=getLS(KEYS.people)||[];
  state.clients=getLS(KEYS.clients)||[];
  state.equipment=getLS(KEYS.equipment)||[];
  state.unavailability=getLS(KEYS.unavailability)||[];
  state.orders=(getLS(KEYS.orders)||[]).map(migrateOrder);
}
function getLS(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function setLS(k,v){localStorage.setItem(k,JSON.stringify(v));}
function saveAll(){
  setLS(KEYS.managers,state.managers);
  setLS(KEYS.currentManager,state.currentManager);
  setLS(KEYS.people,state.people);
  setLS(KEYS.clients,state.clients);
  setLS(KEYS.equipment,state.equipment);
  setLS(KEYS.unavailability,state.unavailability);
  setLS(KEYS.orders,state.orders);
}
function migrateOrder(o){
  if(!o.start_date&&o.date){o.start_date=o.date;o.end_date=o.date;delete o.date;}
  if(!o.work_type)o.work_type='external';
  if(!o.travel_type)o.travel_type='none';
  if(typeof o.open_ended==='undefined')o.open_ended=false;
  if(!o.equipment_ids)o.equipment_ids=[];
  if(!o.status)o.status='open';
  if(!o.issues)o.issues='';
  return o;
}

/* ============================================================
   Helpers
   ============================================================ */
function uid(p){return (p||'id')+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function toast(msg,type){var el=document.getElementById('toast');el.textContent=msg;el.className='toast show '+(type||'');clearTimeout(el._t);el._t=setTimeout(function(){el.className='toast '+(type||'');},2500);}
function getOrder(id){for(var i=0;i<state.orders.length;i++)if(state.orders[i].id===id)return state.orders[i];return null;}
function getPerson(id){for(var i=0;i<state.people.length;i++)if(state.people[i].id===id)return state.people[i];return null;}
function getClient(id){for(var i=0;i<state.clients.length;i++)if(state.clients[i].id===id)return state.clients[i];return null;}
function getEquip(id){for(var i=0;i<state.equipment.length;i++)if(state.equipment[i].id===id)return state.equipment[i];return null;}
function fmtDate(d){if(!d)return '—';var x=new Date(d+'T00:00:00');if(isNaN(x))return d;return x.toLocaleDateString('ar-EG',{day:'numeric',month:'short',year:'numeric'});}

/* ============================================================
   Conflict detection
   ============================================================ */
function datesOverlap(aS,aE,bS,bE){
  if(!aS||!bS)return false;
  var aEnd=aE||'9999-12-31';
  var bEnd=bE||'9999-12-31';
  return aS<=bEnd&&bS<=aEnd;
}
function getPersonConflicts(personId,orderId){
  var order=getOrder(orderId);
  if(!order)return [];
  var conflicts=[];
  var myS=order.start_date,myE=order.open_ended?'9999-12-31':order.end_date;
  for(var i=0;i<state.orders.length;i++){
    var o=state.orders[i];
    if(o.id===orderId)continue;
    if(o.status==='cancelled'||o.status==='done_ok')continue;
    var assigned=false;
    for(var r in o.assignments){
      if(o.assignments[r].indexOf(personId)!==-1){assigned=true;break;}
    }
    if(!assigned)continue;
    var oS=o.start_date,oE=o.open_ended?'9999-12-31':o.end_date;
    if(datesOverlap(myS,myE,oS,oE)){
      conflicts.push({type:'order',order:o});
    }
  }
  for(var j=0;j<state.unavailability.length;j++){
    var u=state.unavailability[j];
    if(u.person_id!==personId)continue;
    if(datesOverlap(myS,myE,u.from_date,u.to_date)){
      conflicts.push({type:'vacation',unavailability:u});
    }
  }
  return conflicts;
}
function getEquipConflicts(equipId,orderId){
  var order=getOrder(orderId);
  if(!order)return [];
  var conflicts=[];
  var myS=order.start_date,myE=order.open_ended?'9999-12-31':order.end_date;
  for(var i=0;i<state.orders.length;i++){
    var o=state.orders[i];
    if(o.id===orderId)continue;
    if(o.status==='cancelled'||o.status==='done_ok')continue;
    if(!o.equipment_ids||o.equipment_ids.indexOf(equipId)===-1)continue;
    var oS=o.start_date,oE=o.open_ended?'9999-12-31':o.end_date;
    if(datesOverlap(myS,myE,oS,oE)){
      conflicts.push({type:'order',order:o});
    }
  }
  return conflicts;
}

/* ============================================================
   Render
   ============================================================ */
function render(){
  document.querySelectorAll('#main-tabs button').forEach(function(b){
    b.classList.toggle('active',b.getAttribute('data-tab')===state.currentTab);
  });
  var main=document.getElementById('main');
  main.innerHTML='';
  var t=state.currentTab;
  if(t==='orders')renderOrders(main);
  else if(t==='new-order')renderNewOrder(main);
  else if(t==='team')renderTeam(main);
  else if(t==='clients')renderClients(main);
  else if(t==='equipment')renderEquipment(main);
  else if(t==='vacations')renderVacations(main);
  else if(t==='assign')renderAssign(main);
}

/* -------- Orders List -------- */
function renderOrders(main){
  var today=todayISO();
  var todayO=[],upcoming=[],past=[];
  var sorted=state.orders.slice().sort(function(a,b){return (a.start_date||'').localeCompare(b.start_date||'');});
  sorted.forEach(function(o){
    if(o.start_date===today)todayO.push(o);
    else if(o.start_date>today)upcoming.push(o);
    else past.push(o);
  });
  var html='<h1>الأوردرات</h1><p class="sub">'+state.orders.length+' أوردر إجمالي</p>';
  if(state.orders.length===0){
    html+='<div class="empty-state"><div class="icon">📭</div><h3>مفيش أوردرات لسه</h3><p>اضغط على "+ أوردر جديد"</p></div>';
  }else{
    if(todayO.length){html+='<h2>📌 النهاردة ('+todayO.length+')</h2>';todayO.forEach(function(o){html+=orderCard(o);});}
    if(upcoming.length){html+='<h2>📅 قادم ('+upcoming.length+')</h2>';upcoming.forEach(function(o){html+=orderCard(o);});}
    if(past.length){html+='<h2>✅ سابق ('+past.length+')</h2>';past.forEach(function(o){html+=orderCard(o);});}
  }
  main.innerHTML=html;
  main.querySelectorAll('[data-assign]').forEach(function(b){b.onclick=function(){state.assigningOrderId=b.getAttribute('data-assign');state.currentTab='assign';render();};});
  main.querySelectorAll('[data-del-order]').forEach(function(b){b.onclick=function(){
    if(!confirm('متأكد تحذف الأوردر؟'))return;
    state.orders=state.orders.filter(function(o){return o.id!==b.getAttribute('data-del-order');});
    saveAll();render();toast('تم الحذف','success');
  };});
}
function orderCard(o){
  var rolesHtml=o.roles.map(function(r){
    var a=(o.assignments&&o.assignments[r.role])?o.assignments[r.role].length:0;
    var complete=a>=r.count;
    return '<div class="role-row'+(complete?' complete':'')+'"><span>'+esc(r.role)+'</span><span>'+a+' / '+r.count+(complete?' ✅':'')+'</span></div>';
  }).join('');
  var equipHtml='';
  if(o.equipment_ids&&o.equipment_ids.length){
    equipHtml='<div class="meta">🎒 '+o.equipment_ids.map(function(id){var e=getEquip(id);return e?esc(e.name):'?';}).join(' • ')+'</div>';
  }
  var travel=o.travel_type==='inside'?'✈️ سفر داخل مصر':o.travel_type==='outside'?'🌍 سفر خارج مصر':'';
  var workType=o.work_type==='office'?'🏢 مقر':'🌐 خارجي';
  var dateStr=fmtDate(o.start_date)+(o.open_ended?' (مفتوح)':(o.end_date&&o.end_date!==o.start_date?' → '+fmtDate(o.end_date):''));
  var issuesHtml=o.issues?'<div class="warn-box">⚠️ مشاكل: '+esc(o.issues)+'</div>':'';
  return '<div class="item-card '+o.status+'">'+
    '<div class="item-head"><h3>'+esc(o.client_name||'—')+'</h3><span class="badge '+o.status+'">'+STATUS_LABELS[o.status]+'</span></div>'+
    '<div class="meta"><span>📅 '+dateStr+'</span><span>'+workType+'</span><span>📍 '+esc(o.location||'—')+'</span>'+(travel?'<span>'+travel+'</span>':'')+'<span>👤 '+esc(o.created_by||'—')+'</span></div>'+
    rolesHtml+equipHtml+issuesHtml+
    '<div class="form-actions"><button class="btn btn-primary btn-sm" data-assign="'+o.id+'">✏️ تعيين / تعديل</button><button class="btn btn-danger btn-sm" data-del-order="'+o.id+'">حذف</button></div>'+
  '</div>';
}

/* -------- New Order -------- */
function renderNewOrder(main){
  if(state.tempRoles.length===0)state.tempRoles=[{role:'مصور',count:1}];
  var clientOpts='<option value="">— اختار عميل —</option>'+state.clients.map(function(c){return '<option value="'+c.id+'">'+esc(c.name)+'</option>';}).join('');
  var html='<h1>أوردر جديد</h1><p class="sub">حدد كل التفاصيل</p>'+
    '<div class="card"><div class="form-grid">'+
    '<div class="form-group"><label>العميل</label><select id="f-client">'+clientOpts+'</select></div>'+
    '<div class="form-group"><label>نوع الشغل</label><select id="f-work"><option value="external">خارجي</option><option value="office">مقر</option></select></div>'+
    '<div class="form-group"><label>من تاريخ</label><input id="f-start" type="date" value="'+todayISO()+'"></div>'+
    '<div class="form-group"><label>لتاريخ</label><input id="f-end" type="date" value="'+todayISO()+'"></div>'+
    '<div class="form-group"><label style="flex-direction:row;display:flex;gap:6px;align-items:center"><input id="f-open" type="checkbox"> أيام مفتوحة (بدون نهاية)</label></div>'+
    '<div class="form-group"><label>السفر</label><select id="f-travel"><option value="none">بدون سفر</option><option value="inside">داخل مصر</option><option value="outside">خارج مصر</option></select></div>'+
    '<div class="form-group"><label>ساعة الحضور</label><input id="f-time" type="time" value="10:00"></div>'+
    '<div class="form-group"><label>ساعة التحرك</label><input id="f-depart" type="time" value="09:00"></div>'+
    '<div class="form-group full"><label>المكان</label><input id="f-loc" type="text" placeholder="مبنى اليوم السابع"></div>'+
    '</div>'+
    '<h2 style="margin-top:24px">الأدوار المطلوبة</h2><div id="roles-box"></div>'+
    '<button type="button" class="btn btn-secondary btn-sm" id="add-role" style="margin-top:10px">+ أضف دور</button>'+
    '<h2 style="margin-top:24px">المعدات المطلوبة</h2><div id="equip-box"></div>'+
    '<button type="button" class="btn btn-secondary btn-sm" id="add-equip" style="margin-top:10px">+ أضف معدة</button>'+
    '<div class="form-actions"><button type="button" class="btn btn-primary" id="save-order">💾 احفظ الأوردر</button>'+
    '<button type="button" class="btn btn-secondary" id="reset-order">إلغاء</button></div></div>';
  main.innerHTML=html;
  renderRoleRows();renderEquipRows();
  document.getElementById('add-role').onclick=function(){state.tempRoles.push({role:'مصور',count:1});renderRoleRows();};
  document.getElementById('add-equip').onclick=function(){state.tempEquipment.push({id:''});renderEquipRows();};
  document.getElementById('reset-order').onclick=function(){state.tempRoles=[{role:'مصور',count:1}];state.tempEquipment=[];renderNewOrder(main);};
  document.getElementById('save-order').onclick=saveOrder;
}
function renderRoleRows(){
  var c=document.getElementById('roles-box');if(!c)return;
  c.innerHTML=state.tempRoles.map(function(r,i){
    return '<div class="role-row" style="background:#fff;border:1px solid var(--border)">'+
      '<select data-i="'+i+'" data-k="role" style="max-width:160px">'+ROLE_PRESET.map(function(p){return '<option'+(p===r.role?' selected':'')+'>'+p+'</option>';}).join('')+'</select>'+
      '<input type="number" min="1" value="'+r.count+'" data-i="'+i+'" data-k="count" style="max-width:80px">'+
      '<button type="button" data-remove="'+i+'" style="background:transparent;border:none;color:var(--danger);font-size:18px;cursor:pointer">×</button>'+
    '</div>';
  }).join('');
  c.querySelectorAll('select,input').forEach(function(el){el.onchange=function(){
    var i=+el.getAttribute('data-i');var k=el.getAttribute('data-k');
    state.tempRoles[i][k]=k==='count'?(+el.value||1):el.value;
  };});
  c.querySelectorAll('[data-remove]').forEach(function(b){b.onclick=function(){
    state.tempRoles.splice(+b.getAttribute('data-remove'),1);
    if(!state.tempRoles.length)state.tempRoles=[{role:'مصور',count:1}];
    renderRoleRows();
  };});
}
function renderEquipRows(){
  var c=document.getElementById('equip-box');if(!c)return;
  if(!state.equipment.length){c.innerHTML='<p class="sub">مفيش معدات مسجلة. ضيفها من تاب المعدات الأول.</p>';return;}

      '</select>'+
      '<button type="button" data-erm="'+i+'" style="background:transparent;border:none;color:var(--danger);font-size:18px;cursor:pointer">×</button>'+

function saveOrder(){
  var clientId=document.getElementById('f-client').value;
  var start=document.getElementById('f-start').value;
  var end=document.getElementById('f-end').value;
  var open=document.getElementById('f-open').checked;
  if(!clientId){toast('اختار عميل','error');return;}
  if(!start){toast('اختار تاريخ البداية','error');return;}
  if(!open&&!end){toast('اختار تاريخ النهاية أو فعّل "أيام مفتوحة"','error');return;}
  var client=getClient(clientId);
  var order={
    id:uid('order'),
    client_id:clientId,
    client_name:client?client.name:'',
    work_type:document.getElementById('f-work').value,
    start_date:start,
    end_date:open?start:end,
    open_ended:open,
    travel_type:document.getElementById('f-travel').value,
    time:document.getElementById('f-time').value,
    departure:document.getElementById('f-depart').value,
    location:document.getElementById('f-loc').value.trim(),
    roles:state.tempRoles.map(function(r){return {role:r.role,count:+r.count};}),
    equipment_ids:state.tempEquipment.filter(function(e){return e.id;}).map(function(e){return e.id;}),
    assignments:{},
    status:'open',
    issues:'',
    created_by:state.currentManager,
    createdAt:new Date().toISOString()
  };
  state.orders.unshift(order);
  saveAll();
  toast('تم حفظ الأوردر ✅','success');
  state.tempRoles=[{role:'مصور',count:1}];state.tempEquipment=[];
  state.currentTab='orders';render();
}

/* -------- Assign Screen -------- */
function renderAssign(main){
  var order=getOrder(state.assigningOrderId);
  if(!order){state.currentTab='orders';render();return;}
  var html='<div class="item-head"><div><h1>تعيين: '+esc(order.client_name)+'</h1>'+
    '<p class="sub">'+fmtDate(order.start_date)+(order.open_ended?' (مفتوح)':(order.end_date&&order.end_date!==order.start_date?' → '+fmtDate(order.end_date):''))+' • '+esc(order.location||'—')+'</p></div>'+
    '<button class="btn btn-secondary btn-sm" id="back-btn">← رجوع</button></div>';

  /* Status controls */
  html+='<div class="card"><h2 style="margin-top:0">حالة الأوردر</h2><div class="form-actions">'+
    '<select id="status-sel" style="max-width:200px">'+
    Object.keys(STATUS_LABELS).map(function(s){return '<option value="'+s+'"'+(order.status===s?' selected':'')+'>'+STATUS_LABELS[s]+'</option>';}).join('')+
    '</select>'+
    '<input id="issues-input" type="text" placeholder="ملاحظات المشاكل (لو خلص بمشاكل)" value="'+esc(order.issues||'')+'" style="flex:1;min-width:200px">'+
    '<button class="btn btn-primary btn-sm" id="save-status">حفظ</button>'+
    '</div></div>';

  /* Roles */
  for(var i=0;i<order.roles.length;i++){
    var r=order.roles[i];
    var assignedIds=order.assignments[r.role]||[];
    var complete=assignedIds.length>=r.count;
    html+='<div class="card"><div class="item-head"><h2 style="margin:0">'+esc(r.role)+' <span class="badge '+(complete?'assigned':'open')+'">'+assignedIds.length+' / '+r.count+'</span></h2></div>';
    if(assignedIds.length){
      html+='<div class="assigned-list">';
      assignedIds.forEach(function(pid){
        var p=getPerson(pid);if(!p)return;
        var conf=getPersonConflicts(pid,order.id);
        var confHtml='';
        if(conf.length){
          confHtml='<span class="conflict">⚠️ '+'</span>';
        }
        html+='<div class="assigned-person"><span>'+confHtml+'👤 '+esc(p.name)+' <span class="badge '+p.type+'">'+personTypeLabel(p.type)+'</span></span>'+
          '<button data-rm-p="'+pid+'" data-rm-r="'+esc(r.role)+'" style="background:transparent;border:none;color:var(--danger);cursor:pointer;font-size:16px">×</button></div>';
      });
      html+='</div>';
    }
    if(!complete){
      var eligible=getEligible(order.id,r.role);
      if(!eligible.length){
        html+='<p class="sub">مفيش أشخاص متاحين. ضيفهم من تاب الفريق.</p>';
      }else{
        html+='<div style="display:flex;gap:8px;margin-top:8px"><select data-role-sel="'+i+'" style="flex:1">'+
          '<option value="">— اختار شخص —</option>'+
          eligible.map(function(e){
            var tag='';
            if(e.conflicts.length)tag=' ⚠️ متعارض';
            else if(e.onVacation)tag=' 🏖️ إجازة';
            else if(e.matchesSkill)tag=' ✅';
            return '<option value="'+e.person.id+'">'+esc(e.person.name)+' ('+personTypeLabel(e.person.type)+tag+')</option>';
          }).join('')+
          '</select>'+
          '<button class="btn btn-primary btn-sm" data-add-role="'+esc(r.role)+'" data-role-sel-idx="'+i+'">+ أضف</button></div>';
      }
    }
    html+='</div>';
  }

  /* Equipment */
  html+='<div class="card"><h2 style="margin-top:0">المعدات</h2>';
  if(!order.equipment_ids||!order.equipment_ids.length){
    html+='<p class="sub">مفيش معدات مطلوبة.</p>';
  }else{
    html+='<div class="assigned-list">'+order.equipment_ids.map(function(eid){
      var e=getEquip(eid);if(!e)return '';
      var conf=getEquipConflicts(eid,order.id);
      return '<div class="assigned-person"><span>'+(conf.length?'⚠️ ':'')+'🎒 '+esc(e.name)+' <span class="badge '+e.source+'">'+(e.source==='internal'?'داخلي':'مستأجر')+'</span></span></div>';
    }).join('')+'</div>';
  }
  html+='</div>';

  main.innerHTML=html;

  document.getElementById('back-btn').onclick=function(){state.currentTab='orders';state.assigningOrderId=null;render();};
  document.getElementById('save-status').onclick=function(){
    order.status=document.getElementById('status-sel').value;
    order.issues=document.getElementById('issues-input').value.trim();
    saveAll();toast('تم الحفظ','success');render();
  };
  main.querySelectorAll('[data-add-role]').forEach(function(b){b.onclick=function(){
    var idx=+b.getAttribute('data-role-sel-idx');
    var sel=main.querySelector('[data-role-sel="'+idx+'"]');
    if(!sel.value){toast('اختار شخص','error');return;}
    addPersonToRole(order.id,b.getAttribute('data-add-role'),sel.value);
  };});
  main.querySelectorAll('[data-rm-p]').forEach(function(b){b.onclick=function(){
    var pid=b.getAttribute('data-rm-p');var role=b.getAttribute('data-rm-r');
    order.assignments[role]=order.assignments[role].filter(function(x){return x!==pid;});
    saveAll();render();
  };});
}
function getEligible(orderId,role){
  var order=getOrder(orderId);if(!order)return [];
  var assignedIds=[];
  for(var r in order.assignments)assignedIds=assignedIds.concat(order.assignments[r]);
  return state.people
    .filter(function(p){return assignedIds.indexOf(p.id)===-1;})
    .map(function(p){
      var skills=(p.skills||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
      return {
        person:p,
        matchesSkill:skills.indexOf(role)!==-1,
        conflicts:getPersonConflicts(p.id,orderId).filter(function(c){return c.type==='order';}),
        onVacation:getPersonConflicts(p.id,orderId).some(function(c){return c.type==='vacation';})
      };
    })
    .sort(function(a,b){
      if(a.conflicts.length&&!b.conflicts.length)return 1;
      if(!a.conflicts.length&&b.conflicts.length)return -1;
      if(a.onVacation&&!b.onVacation)return 1;
      if(!a.onVacation&&b.onVacation)return -1;
      if(b.matchesSkill!==a.matchesSkill)return b.matchesSkill?1:-1;
      return 0;
    });
}
function addPersonToRole(orderId,role,personId){
  var order=getOrder(orderId);if(!order)return;
  if(!order.assignments[role])order.assignments[role]=[];
  var r=null;for(var i=0;i<order.roles.length;i++)if(order.roles[i].role===role)r=order.roles[i];
  if(!r)return;
  if(order.assignments[role].length>=r.count){toast('الدور مكتمل','error');return;}
  var conflicts=getPersonConflicts(personId,orderId);
  if(conflicts.length){
    var ok=confirm('⚠️ في تضارب:\n'+conflicts.map(function(c){
      return c.type==='order'?('معين في أوردر: '+c.order.client_name+' ('+fmtDate(c.order.start_date)+')'):('في إجازة: '+fmtDate(c.unavailability.from_date)+' → '+fmtDate(c.unavailability.to_date));
    }).join('\n')+'\n\nتكمل التعيين؟');
    if(!ok)return;
  }
  order.assignments[role].push(personId);
  /* Auto-status */
  if(order.status==='open')order.status='assigned';
  var allFull=true;
  for(var j=0;j<order.roles.length;j++){
    var rr=order.roles[j];
    if((order.assignments[rr.role]||[]).length<rr.count){allFull=false;break;}
  }
  if(allFull)order.status='assigned';
  saveAll();render();toast('تم التعيين','success');
}
